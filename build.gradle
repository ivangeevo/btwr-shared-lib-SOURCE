plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

fabricApi {
    configureDataGeneration() {modId = "btwr_sl"}
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "btwr_sl" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { url "https://ivangeevo.github.io/btwr-shared-lib/" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.ladysnake.org/releases" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config
    modApi "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // Mod Menu
    modApi "com.terraformersmc:modmenu:${project.mod_menu_version}"

    // --- COMPAT --- //
    // Im 'movens (for testing penalties)
    //modImplementation "maven.modrinth:im-movens:${project.im_movens_version}"
    //modCompileOnly files("libs/im-movens-${project.im_movens_version}-1.21.1.jar")
    // Leave My Bars Alone - LMBA
    modCompileOnly "maven.modrinth:leave-my-bars-alone:${project.leave_my_bars_alone_version}"
    modLocalRuntime "maven.modrinth:leave-my-bars-alone:${project.leave_my_bars_alone_version}"
    // Tough As Nails
    modCompileOnly "maven.modrinth:tough-as-nails:${project.tough_as_nails_version}"
    modLocalRuntime "maven.modrinth:tough-as-nails:${project.tough_as_nails_version}"
    // Heart Meals (for compatibility checking)
    //modCompileOnly "maven.modrinth:hearty-meals:${project.hearty_meals_version}"
    //modLocalRuntime "maven.modrinth:hearty-meals:${project.hearty_meals_version}"
    // Forge Config API Port - LMBA required
    modCompileOnly "maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}"
    modLocalRuntime "maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}"
    // Puzzles Lib - LMBA required
    modCompileOnly "maven.modrinth:puzzles-lib:${project.puzzles_lib_version}"
    modLocalRuntime "maven.modrinth:puzzles-lib:${project.puzzles_lib_version}"
    // Night Config - LMBA required
    modCompileOnly "com.electronwill.night-config:toml:${project.night_config_version}"
    modLocalRuntime "com.electronwill.night-config:toml:${project.night_config_version}"
    // Glitch Core - Tough As Nails required
    modCompileOnly "maven.modrinth:glitchcore:${project.glitch_core_version}"
    modLocalRuntime "maven.modrinth:glitchcore:${project.glitch_core_version}"
    // Cardinal Components API - Hearty Meals required
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_api_version}"
    modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_api_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cardinal_components_api_version}"
    modLocalRuntime "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_api_version}"
    // MidnightLib
    modCompileOnly "maven.modrinth:midnightlib:${project.midnightlib_version}"
    modLocalRuntime "maven.modrinth:midnightlib:${project.midnightlib_version}"

    // ------------- //

    // EMI
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modCompileOnly "dev.emi:emi-fabric:${emi_version}"
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        maven {
            // Set the custom directory for local publishing
            url = uri('./maven')
        }
    }

    loom {
        accessWidenerPath = file("src/main/resources/btwr_sl.accesswidener")
    }
}